databases:
  - name: scholi-db
    plan: free
    region: oregon

services:
  - type: web
    name: scholi-backend
    env: docker
    branch: main
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scholi-db
          property: connectionString
      - key: JWT_SECRET
        value: "replace_me"
    repo: https://github.com/mejakivos/scholi-demo

  - type: web
    name: scholi-frontend
    env: static
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: school_calendar_deliverables/frontend/dist
    envVars:
      - key: REACT_APP_API_URL
        value: "/"
    repo: https://github.com/mejakivos/scholi-demo







